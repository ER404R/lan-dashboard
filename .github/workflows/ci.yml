name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install "ruff>=0.11.0"

      - name: Run ruff
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        env:
          SECRET_KEY: ci-test-secret-key-minimum-32chars!
          DATABASE_URL: "sqlite:///:memory:"
          REGISTRATION_ENABLED: "true"
          ADMIN_INVITE_TOKEN: ci-admin-token
          SEED_INVITE_TOKENS: ""
        run: pytest -v
